<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة إعلان - Chronet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Chronet</h1>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="add.html">إضافة إعلان</a>
            <a href="favorites.html">المفضلة</a>
            <a href="profile.html">حسابي</a>
        </nav>
    </header>

    <main class="container">

        <h2>إضافة إعلان جديد</h2>

        <form id="addForm">

            <label for="type">نوع الإعلان</label>
            <select id="type" required>
                <option value="product">منتج</option>
                <option value="service">خدمة</option>
            </select>

            <label for="title">العنوان</label>
            <input
                type="text"
                id="title"
                placeholder="عنوان الإعلان"
                required
            >

            <label for="price">السعر</label>
            <input
                type="number"
                id="price"
                min="0"
                step="0.01"
                placeholder="السعر"
                required
            >

            <label for="currency">العملة</label>
            <select id="currency" required>
                <option value="USD">USD - دولار أمريكي</option>
                <option value="EUR">EUR - يورو</option>
                <option value="GBP">GBP - جنيه إسترليني</option>
                <option value="MAD" selected>MAD - درهم مغربي</option>
                <option value="AED">AED - درهم إماراتي</option>
                <option value="SAR">SAR - ريال سعودي</option>
                <option value="QAR">QAR - ريال قطري</option>
                <option value="KWD">KWD - دينار كويتي</option>
                <option value="BHD">BHD - دينار بحريني</option>
                <option value="CAD">CAD - دولار كندي</option>
                <option value="AUD">AUD - دولار أسترالي</option>
                <option value="JPY">JPY - ين ياباني</option>
                <option value="CNY">CNY - يوان صيني</option>
                <option value="INR">INR - روبية هندية</option>
                <option value="BDT">BDT - تاكا بنغلاديشي</option>
                <option value="TRY">TRY - ليرة تركية</option>
                <option value="CHF">CHF - فرنك سويسري</option>
                <option value="BRL">BRL - ريال برازيلي</option>
                <option value="ZAR">ZAR - راند جنوب أفريقي</option>
            </select>

            <label for="country">الدولة</label>
            <input
                type="text"
                id="country"
                placeholder="الدولة"
                value="Morocco"
                required
            >

            <label for="city">المدينة</label>
            <input
                type="text"
                id="city"
                placeholder="المدينة"
                required
            >

            <label for="description">الوصف</label>
            <textarea
                id="description"
                placeholder="اكتب وصف الإعلان..."
                rows="6"
            ></textarea>

            <label for="images">الصور</label>
            <input
                type="file"
                id="images"
                accept="image/*"
                multiple
            >

            <button type="submit" id="publishButton">
                نشر الإعلان
            </button>

            <p id="message"></p>

        </form>

    </main>

    <script type="module" src="add.js"></script>

</body>
</html>
