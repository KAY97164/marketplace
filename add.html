<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إضافة إعلان - Chronet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Chronet</h1>
        <p>أضف إعلانك</p>
    </header>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="add.html">أضف إعلانًا</a>
    </nav>

    <main>

        <h2>إنشاء إعلان جديد</h2>

        <form id="listingForm">

            <label for="type">نوع الإعلان</label>

            <select id="type" required>
                <option value="">اختر النوع</option>
                <option value="product">سلعة للبيع</option>
                <option value="service">خدمة</option>
            </select>

            <label for="title">اسم الإعلان</label>

            <input
                type="text"
                id="title"
                placeholder="مثال: جاكيت Vintage"
                required
            >

            <label for="price">السعر</label>

            <input
                type="number"
                id="price"
                placeholder="السعر بالدرهم"
                required
            >

            <label for="city">المدينة</label>

            <input
                type="text"
                id="city"
                placeholder="مثال: الدار البيضاء"
                required
            >

            <label for="description">الوصف</label>

            <textarea
                id="description"
                placeholder="اكتب وصفًا للإعلان..."
                required
            ></textarea>
<label for="images">صور الإعلان</label>

<input
    type="file"
    id="images"
    accept="image/*"
    multiple
    required
>
            <button type="submit">
                نشر الإعلان
            </button>

        </form>
<script src="add.js"></script>
    </main>

    <footer>
        <p>© 2026 Chronet</p>
    </footer>

</body>

</html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="add.js"></script>
