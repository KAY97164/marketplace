<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب - Chronet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Chronet</h1>
    <p>إتمام الطلب 💳</p>
</header>

<nav>
    <a href="index.html">الرئيسية</a>
    <a href="products.html">المنتجات</a>
    <a href="services.html">الخدمات</a>
    <a href="add.html">أضف إعلانًا</a>
    <a href="profile.html">حسابي</a>
    <a href="favorites.html">المفضلة ❤️</a>
    <a href="messages.html">الرسائل 💬</a>
    <a href="notifications.html">الإشعارات 🔔</a>
    <a href="cart.html">السلة 🛒</a>
    <a href="orders.html">طلباتي 📦</a>
    <a href="seller-orders.html">طلبات البيع 📦</a>
</nav>

<main>

    <h2>إتمام الطلب</h2>

    <section id="checkoutItems">
        <p>جاري تحميل السلة...</p>
    </section>

    <section>
        <h3 id="checkoutTotal">
            المجموع: 0
        </h3>
    </section>

    <form id="checkoutForm">

        <label for="shippingAddress">
            عنوان الشحن
        </label>

        <textarea
            id="shippingAddress"
            maxlength="1000"
            required
            placeholder="اكتب عنوان الشحن بالتفصيل..."
        ></textarea>

        <label for="paymentMethod">
            طريقة الدفع
        </label>

        <select id="paymentMethod" required>

            <option value="">
                اختر طريقة الدفع
            </option>

            <option value="cash_on_delivery">
                الدفع عند الاستلام
            </option>

            <option value="card">
                بطاقة بنكية 💳
            </option>

            <option value="paypal">
                PayPal
            </option>

        </select>

        <button
            type="submit"
            id="placeOrderButton"
        >
            تأكيد الطلب
        </button>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="checkout.js"></script>

</body>
</html>
