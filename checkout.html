<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب - Chronet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Chronet</h1>
    <p>إتمام الطلب 🛍️</p>
</header>

<nav>
    <a href="index.html">الرئيسية</a>
    <a href="add.html">أضف إعلانًا</a>
    <a href="profile.html">حسابي</a>
    <a href="favorites.html">المفضلة ❤️</a>
    <a href="messages.html">الرسائل 💬</a>
    <a href="notifications.html">الإشعارات 🔔</a>
    <a href="cart.html">السلة 🛒</a>
    <a href="orders.html">طلباتي 📦</a>
    <a href="seller-orders.html">طلبات البيع 📦</a>
</nav>

<main>

    <h2>تأكيد الطلب</h2>

    <div id="checkoutList">
        جاري تحميل الطلب...
    </div>

    <hr>

    <h2>
        المجموع:
        <span id="checkoutTotal">0</span>
        درهم
    </h2>

    <form id="checkoutForm">

        <label for="shippingAddress">
            عنوان التوصيل
        </label>

        <textarea
            id="shippingAddress"
            rows="4"
            maxlength="500"
            placeholder="اكتبي عنوان التوصيل..."
            required
        ></textarea>

        <label for="paymentMethod">
            طريقة الدفع
        </label>

        <select id="paymentMethod" required>
            <option value="">
                اختاري طريقة الدفع
            </option>
            <option value="cash_on_delivery">
                الدفع عند الاستلام
            </option>
        </select>

        <button type="submit">
            تأكيد الطلب
        </button>

    </form>

    <p id="checkoutMessage"></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="checkout.js"></script>

</body>
</html>
