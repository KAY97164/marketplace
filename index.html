</head>

<body>

    <header>
        <h1>chronet</h1>

    <main>
        <h2>اكتشف الإعلانات</h2>

        <div class="search">
    <section class="search-section">
    <h2>البحث عن إعلان</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="ابحث عن منتج أو خدمة..."
    >

    <select id="typeFilter">
        <option value="">كل الأنواع</option>
        <option value="product">منتجات</option>
        <option value="service">خدمات</option>
    </select>

    <input
        type="text"
        id="countryFilter"
        placeholder="الدولة"
    >

    <input
        type="text"
        id="cityFilter"
        placeholder="المدينة"
    >

    <input
        type="number"
        id="minPrice"
        placeholder="أقل سعر"
        min="0"
    >

    <input
        type="number"
        id="maxPrice"
        placeholder="أعلى سعر"
        min="0"
    >

    <select id="sortFilter">
        <option value="newest">الأحدث أولًا</option>
        <option value="oldest">الأقدم أولًا</option>
        <option value="price_low">السعر: من الأقل للأعلى</option>
        <option value="price_high">السعر: من الأعلى للأعلى</option>
    </select>

    <button id="searchButton">
        بحث
    </button>
</section>
            
        </div>

        <section class="categories">
            <button>ملابس</button>
            <button>إلكترونيات</button>
            <button>سيارات</button>
            <button>خدمات</button>
            <button>منزل</button>
        </section>

        <section class="listings">

            <div class="listing">
                
            </div>

            <div class="listing">
                
            </div>

            <div class="listing">
                
            </div>

        </section>
    </main>
<section class="listings">

    <h2>أحدث الإعلانات</h2>

    <div id="listingsContainer">
        <p>جاري تحميل الإعلانات...</p>
    </div>

</section>
    <footer>
        <p>© 2026 Marketplace</p>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
