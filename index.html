<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chronet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>chronet</h1>
        <p>اشترِ، بِع، وقدّم خدماتك</p>
    </header>

    <nav>
        <a href="#">الرئيسية</a>
        <a href="#">السلع</a>
        <a href="#">الخدمات</a>
        <a href="add.html">أضف إعلانًا</a>
    </nav>

    <main>
        <h2>اكتشف الإعلانات</h2>

        <div class="search">
            <input type="text" placeholder="ماذا تبحث؟">
            <button>بحث</button>
        </div>

        <section class="categories">
            <button>ملابس</button>
            <button>إلكترونيات</button>
            <button>سيارات</button>
            <button>خدمات</button>
            <button>منزل</button>
        </section>

        <section class="listings">

            <div class="listing">
                <h3>جاكيت Vintage</h3>
                <p>جاكيت بحالة ممتازة</p>
                <strong>150 DH</strong>
            </div>

            <div class="listing">
                <h3>تصميم شعار</h3>
                <p>أقدم خدمة تصميم شعارات</p>
                <strong>100 DH</strong>
            </div>

            <div class="listing">
                <h3>هاتف مستعمل</h3>
                <p>هاتف بحالة جيدة</p>
                <strong>1200 DH</strong>
            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 Marketplace</p>
    </footer>

</body>
</html>
