<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الإعلان - Chronet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Chronet</h1>
    <p>تعديل الإعلان ✏️</p>
</header>

<nav>
    <a href="index.html">الرئيسية</a>
    <a href="products.html">المنتجات</a>
    <a href="services.html">الخدمات</a>
    <a href="add.html">أضف إعلانًا</a>
    <a href="profile.html">حسابي</a>
    <a href="favorites.html">المفضلة ❤️</a>
    <a href="messages.html">الرسائل 💬</a>
    <a href="notifications.html">الإشعارات 🔔</a>
    <a href="cart.html">السلة 🛒</a>
    <a href="orders.html">طلباتي 📦</a>
    <a href="seller-orders.html">طلبات البيع 📦</a>
</nav>

<main>

    <h2>تعديل الإعلان</h2>

    <form id="editForm">

        <label for="type">نوع الإعلان</label>
        <select id="type" required>
            <option value="product">منتج</option>
            <option value="service">خدمة</option>
        </select>

        <label for="title">عنوان الإعلان</label>
        <input
            type="text"
            id="title"
            maxlength="150"
            required
        >

        <label for="price">السعر</label>
        <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            required
        >

        <label for="currency">العملة</label>
        <select id="currency" required>
            <option value="USD">USD - دولار أمريكي</option>
            <option value="EUR">EUR - يورو</option>
            <option value="GBP">GBP - جنيه إسترليني</option>
            <option value="MAD">MAD - درهم مغربي</option>
            <option value="AED">AED - درهم إماراتي</option>
            <option value="SAR">SAR - ريال سعودي</option>
            <option value="QAR">QAR - ريال قطري</option>
            <option value="KWD">KWD - دينار كويتي</option>
            <option value="BHD">BHD - دينار بحريني</option>
            <option value="CAD">CAD - دولار كندي</option>
            <option value="AUD">AUD - دولار أسترالي</option>
            <option value="JPY">JPY - ين ياباني</option>
            <option value="CNY">CNY - يوان صيني</option>
            <option value="INR">INR - روبية هندية</option>
            <option value="BDT">BDT - تاكا بنغلاديشي</option>
            <option value="TRY">TRY - ليرة تركية</option>
            <option value="CHF">CHF - فرنك سويسري</option>
            <option value="BRL">BRL - ريال برازيلي</option>
            <option value="ZAR">ZAR - راند جنوب أفريقي</option>
        </select>

        <label for="country">الدولة</label>
        <input
            type="text"
            id="country"
            maxlength="100"
            required
        >

        <label for="city">المدينة</label>
        <input
            type="text"
            id="city"
            maxlength="100"
            required
        >

        <label for="description">الوصف</label>
        <textarea
            id="description"
            maxlength="3000"
            required
        ></textarea>

        <label for="images">إضافة صور جديدة</label>
        <input
            type="file"
            id="images"
            accept="image/*"
            multiple
        >

        <button type="submit">
            حفظ التعديلات 💾
        </button>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="edit.js"></script>

</body>
</html>
